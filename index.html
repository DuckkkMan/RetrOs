
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b87">
  <title>RetrOS</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="desktop">
    <header class="desktop-header">
      <div class="system-logo">R</div>
      <div>
        <strong>RetrOS</strong>
        <div class="subtitle">Web Operating System</div>
      </div>
    </header>

    <section id="desktop-icons" aria-label="Aplicativos do desktop"></section>
    <section id="window-layer"></section>

    <nav id="start-menu" class="hidden" aria-label="Menu Iniciar">
      <div class="start-title">RetrOS</div>
      <input id="start-search" type="search" placeholder="Pesquisar aplicativos...">
      <div id="start-apps"></div>
      <button id="start-power" class="menu-app">⏻ Desligar sessão</button>
    </nav>

    <div id="context-menu" class="context-menu hidden">
      <button data-action="refresh">↻ Atualizar desktop</button>
      <button data-action="open-app" data-key="google">🌐 Google</button>
      <button data-action="open-app" data-key="files">📁 Meus Arquivos</button>
      <button data-action="open-app" data-key="creator">🧩 Criar aplicativo</button>
    </div>

    <footer class="taskbar">
      <button id="start-button" title="Menu Iniciar">⊞</button>
      <div id="taskbar-windows"></div>
      <div class="taskbar-status">
        <span title="Conectividade">🌐</span>
        <span id="clock">00:00</span>
      </div>
    </footer>
  </main>
</body>
</html>

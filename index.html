<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetrOS Web</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="desktop">
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="window-layer"></div>

    <div id="start-menu" class="start-menu hidden">
      <div class="start-heading">
        <span class="start-logo">🖥️</span>
        <div>
          <strong>RetrOS</strong>
          <small>Sistema virtual</small>
        </div>
      </div>

      <button data-action="open-app" data-key="computer">🖥️ Meu Computador</button>
      <button data-action="open-app" data-key="files">📁 Meus Arquivos</button>
      <button data-action="open-app" data-key="notes">📝 Bloco de Notas</button>
      <button data-action="open-app" data-key="calculator">🧮 Calculadora</button>
      <button data-action="open-app" data-key="terminal">💻 Terminal</button>
      <button data-action="open-app" data-key="appbuilder">🧩 Criar aplicativo</button>
      <button data-action="open-app" data-key="settings">🎨 Personalização</button>
      <button data-action="open-app" data-key="help">📘 Manual do RetrOS</button>

      <div class="start-footer">RetrOS Web • Edição experimental</div>
    </div>

    <div id="context-menu" class="context-menu hidden">
      <button data-action="open-app" data-key="appbuilder">🧩 Criar aplicativo</button>
      <button data-action="new-text">📄 Novo arquivo de texto</button>
      <button data-action="open-app" data-key="settings">🎨 Personalizar fundo</button>
      <button data-action="refresh-desktop">🔄 Atualizar desktop</button>
    </div>

    <footer class="taskbar">
      <button id="start-button" class="start-button" title="Menu Iniciar">
        🪟 <span>Iniciar</span>
      </button>

      <div id="taskbar-windows"></div>

      <div class="system-tray">
        <span title="RetrOS">🖥️</span>
        <span id="clock">00:00</span>
      </div>
    </footer>
  </main>
</body>
</html>
